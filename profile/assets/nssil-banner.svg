<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">NSSIL — Neural Systems and Signal Intelligence Laboratory</title>
  <desc id="description">IIT Mandi, established 2023. Decoding the language of the brain. A geometric composition of arcs, circles, a grid, and connected nodes in coral, mint, and violet.</desc>
  <defs>
